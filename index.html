<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neşeli Tarayıcı 🎈</title>
    <style>
        :root {
            --bg-primary: #090a0f;
            --bg-secondary: #121520;
            --bg-card: rgba(255, 255, 255, 0.05);
            --text-color: #f3f4f6;
            --text-dim: #9ca3af;
            --accent-grad: linear-gradient(135deg, #ff007f, #7928ca, #00dfd8);
            --header-bg: rgba(18, 21, 32, 0.98);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body.theme-light {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-card: rgba(0, 0, 0, 0.04);
            --text-color: #1e293b;
            --text-dim: #64748b;
            --header-bg: rgba(255, 255, 255, 0.98);
            --border-color: rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ÜST BAŞLIK - KİTLİ SABİT */
        .top-fixed-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 99999;
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
        }

        .tabs-bar {
            display: flex;
            align-items: center;
            background: var(--bg-secondary);
            padding: 6px 8px;
            gap: 6px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border-color);
            scrollbar-width: none;
        }
        .tabs-bar::-webkit-scrollbar { display: none; }

        .tab-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-card);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 13px;
            max-width: 150px;
            min-width: 90px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-dim);
        }

        .tab-item.active {
            background: var(--accent-grad);
            color: white;
            font-weight: 600;
            border-color: transparent;
        }

        .tab-close {
            font-size: 12px;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
        }
        .tab-close:hover { opacity: 1; background: rgba(0,0,0,0.2); }

        .add-tab-btn {
            background: var(--accent-grad);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
        }

        .nav-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: var(--bg-card);
            color: var(--text-color);
            border-radius: 10px;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
        }
        .nav-btn:active { transform: scale(0.92); }

        .url-box {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0 12px;
            height: 38px;
            min-width: 0;
        }

        .url-input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 14px;
            outline: none;
            text-align: center;
        }

        /* İÇERİK ALANI */
        .app-body {
            flex: 1;
            position: relative;
            margin-top: 96px;
            height: calc(100vh - 96px);
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
        }

        .home-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            overflow-y: auto;
        }
        .home-screen.hidden { display: none; }

        .brand-logo {
            font-size: 44px;
            font-weight: 900;
            background: var(--accent-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .brand-sub {
            color: var(--text-dim);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .search-container {
            width: 100%;
            max-width: 480px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }

        .search-container input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 15px;
            outline: none;
            text-align: center;
        }

        .home-section {
            width: 100%;
            max-width: 480px;
            text-align: left;
        }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 12px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .speed-tile {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .tile-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--accent-grad);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: white;
            font-weight: bold;
        }

        .tile-label {
            font-size: 11px;
            color: var(--text-color);
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- ÜST BAŞLIK HER ZAMAN SABİT -->
    <div class="top-fixed-container">
        <div class="tabs-bar" id="tabs-bar">
            <button class="add-tab-btn" onclick="createNewTab()">+</button>
        </div>

        <div class="header-bar">
            <button class="nav-btn" onclick="goBack()">←</button>
            <button class="nav-btn" onclick="goForward()">→️</button>
            <button class="nav-btn" onclick="reloadTab()">↻</button>
            <button class="nav-btn" onclick="goHome()">🎈</button>
            
            <div class="url-box">
                <input type="text" id="url-input" class="url-input" placeholder="Arama yap veya adres yaz..." onkeydown="handleUrlKey(event)">
            </div>
        </div>
    </div>

    <!-- İÇERİK -->
    <div class="app-body">
        <div class="home-screen" id="home-screen">
            <div class="brand-logo">Neşeli 🎈</div>
            <div class="brand-sub">Hızlı ve Özgür İnternet</div>

            <div class="search-container">
                <span>🔍</span>
                <input type="text" id="home-search-input" placeholder="Google'da ara veya URL yaz..." onkeydown="handleHomeSearch(event)">
            </div>

            <div class="home-section">
                <div class="section-title">Hızlı Erişim</div>
                <div class="grid-container" id="bookmarks-grid"></div>
            </div>
        </div>
    </div>

    <script>
        let state = {
            tabs: [],
            activeTabId: null,
            bookmarks: [
                { name: "Google", url: "https://www.google.com" },
                { name: "YouTube", url: "https://www.youtube.com" },
                { name: "GitHub", url: "https://github.com" },
                { name: "Wikipedia", url: "https://tr.wikipedia.org" }
            ]
        };

        window.onload = () => {
            renderBookmarks();
            createNewTab();
        };

        function createNewTab() {
            const id = 'tab_' + Date.now();
            state.tabs.push({ id, title: 'Yeni Sekme', url: null });
            switchTab(id);
        }

        function switchTab(id) {
            state.activeTabId = id;
            const tab = state.tabs.find(t => t.id === id);
            const homeScreen = document.getElementById('home-screen');

            if (tab && tab.url) {
                homeScreen.classList.add('hidden');
                document.getElementById('url-input').value = tab.url;
            } else {
                homeScreen.classList.remove('hidden');
                document.getElementById('url-input').value = '';
            }
            renderTabs();
        }

        function closeTab(id, event) {
            if (event) event.stopPropagation();
            state.tabs = state.tabs.filter(t => t.id !== id);
            if (state.tabs.length === 0) {
                createNewTab();
            } else if (state.activeTabId === id) {
                switchTab(state.tabs[state.tabs.length - 1].id);
            } else {
                renderTabs();
            }
        }

        function renderTabs() {
            const tabsBar = document.getElementById('tabs-bar');
            tabsBar.innerHTML = '';

            state.tabs.forEach(tab => {
                const el = document.createElement('div');
                el.className = `tab-item ${tab.id === state.activeTabId ? 'active' : ''}`;
                el.onclick = () => switchTab(tab.id);
                el.innerHTML = `
                    <span>🎈 ${tab.title}</span>
                    <span class="tab-close" onclick="closeTab('${tab.id}', event)">✕</span>
                `;
                tabsBar.appendChild(el);
            });

            const addBtn = document.createElement('button');
            addBtn.className = 'add-tab-btn';
            addBtn.innerText = '+';
            addBtn.onclick = () => createNewTab();
            tabsBar.appendChild(addBtn);
        }

        function handleUrlKey(e) { if (e.key === 'Enter') navigateTo(e.target.value.trim()); }
        function handleHomeSearch(e) { if (e.key === 'Enter') navigateTo(e.target.value.trim()); }

        function navigateTo(val) {
            if (!val) return;
            let targetUrl = val;
            if (!val.startsWith('http://') && !val.startsWith('https://')) {
                if (val.includes('.') && !val.includes(' ')) {
                    targetUrl = 'https://' + val;
                } else {
                    targetUrl = 'https://www.google.com/search?q=' + encodeURIComponent(val);
                }
            }
            // Sayfa dışına çıkmak yerine yeni sekmede (target="_blank") açarak başlığın kaybolmasını engelliyoruz
            window.open(targetUrl, '_blank');
        }

        function goHome() {
            const tab = state.tabs.find(t => t.id === state.activeTabId);
            if (tab) {
                tab.url = null;
                tab.title = 'Yeni Sekme';
                switchTab(tab.id);
            }
        }

        function goBack() { window.history.back(); }
        function goForward() { window.history.forward(); }
        function reloadTab() { window.location.reload(); }

        function renderBookmarks() {
            const grid = document.getElementById('bookmarks-grid');
            grid.innerHTML = '';
            
            state.bookmarks.forEach((bm) => {
                const el = document.createElement('div');
                el.className = 'speed-tile';
                el.onclick = () => navigateTo(bm.url);
                el.innerHTML = `
                    <div class="tile-icon">${bm.name.charAt(0).toUpperCase()}</div>
                    <div class="tile-label">${bm.name}</div>
                `;
                grid.appendChild(el);
            });
        }
    </script>
</body>
</html>
