<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neşeli Tarayıcı 🎈</title>
    <style>
        :root {
            --bg-primary: #090a0f;
            --bg-secondary: #121520;
            --bg-card: rgba(255, 255, 255, 0.05);
            --text-color: #f3f4f6;
            --text-dim: #9ca3af;
            --accent-grad: linear-gradient(135deg, #ff007f, #7928ca, #00dfd8);
            --header-bg: rgba(18, 21, 32, 0.95);
            --border-color: rgba(255, 255, 255, 0.1);
            --vpn-glow: transparent;
        }

        body.theme-light {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-card: rgba(0, 0, 0, 0.04);
            --text-color: #1e293b;
            --text-dim: #64748b;
            --header-bg: rgba(255, 255, 255, 0.95);
            --border-color: rgba(0, 0, 0, 0.1);
        }

        body.vpn-active {
            --vpn-glow: rgba(16, 185, 129, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s;
        }

        .tabs-bar {
            display: flex;
            align-items: center;
            background: var(--bg-secondary);
            padding: 6px 8px;
            gap: 6px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            scrollbar-width: none;
        }
        .tabs-bar::-webkit-scrollbar { display: none; }

        .tab-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-card);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 13px;
            max-width: 150px;
            min-width: 90px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-dim);
        }

        .tab-item.active {
            background: var(--accent-grad);
            color: white;
            font-weight: 600;
            border-color: transparent;
        }

        .tab-item.incognito {
            border: 1px solid #a855f7;
        }

        .tab-close {
            font-size: 12px;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
        }

        .add-tab-btn {
            background: var(--accent-grad);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            background-color: var(--vpn-glow);
            z-index: 100;
            flex-shrink: 0;
        }

        .header-bottom {
            order: 10;
            border-top: 1px solid var(--border-color);
            border-bottom: none;
        }

        .nav-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: var(--bg-card);
            color: var(--text-color);
            border-radius: 10px;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
        }

        .url-box {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0 12px;
            height: 38px;
            min-width: 0;
        }

        .url-input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 14px;
            outline: none;
            text-align: center;
        }

        .app-body {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .home-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
            text-align: center;
            background: var(--bg-primary);
        }

        .brand-logo {
            font-size: 44px;
            font-weight: 900;
            background: var(--accent-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .brand-sub {
            color: var(--text-dim);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .search-container {
            width: 100%;
            max-width: 480px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            flex-shrink: 0;
        }

        .search-container input {
            flex: 1;
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 15px;
            outline: none;
            text-align: center;
        }

        .home-section {
            width: 100%;
            max-width: 480px;
            text-align: left;
        }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .speed-tile {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            position: relative;
        }

        .tile-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--accent-grad);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: white;
            font-weight: bold;
        }

        .tile-label {
            font-size: 11px;
            color: var(--text-color);
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }

        .tile-delete {
            position: absolute;
            top: 2px; right: 2px;
            width: 16px; height: 16px;
            background: rgba(255,0,0,0.3);
            color: #ff4b2b;
            border-radius: 50%;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
            padding: 20px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }

        select, input[type="checkbox"] { accent-color: #ff007f; }

        select {
            background: var(--bg-card);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 8px;
            outline: none;
        }

        .close-btn {
            background: var(--accent-grad);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="tabs-bar" id="tabs-bar">
        <button class="add-tab-btn" onclick="createNewTab()">+</button>
    </div>

    <div class="header-bar" id="header-bar">
        <button class="nav-btn" onclick="goBack()">←</button>
        <button class="nav-btn" onclick="goForward()">→</button>
        <button class="nav-btn" onclick="reloadTab()">↻</button>
        <button class="nav-btn" onclick="goHome()">🎈</button>
        
        <div class="url-box">
            <input type="text" id="url-input" class="url-input" placeholder="Google'da ara veya adres yazın..." onkeydown="handleUrlKey(event)">
        </div>

        <button class="nav-btn" onclick="toggleSettingsModal()">⚙️</button>
    </div>

    <div class="app-body" id="app-body">
        <div class="home-screen" id="home-screen">
            <div class="brand-logo">Neşeli 🎈</div>
            <div class="brand-sub">Hızlı ve Özgür İnternet</div>

            <div class="search-container">
                <span>🔍</span>
                <input type="text" id="home-search-input" placeholder="Google'da ara veya URL yaz..." onkeydown="handleHomeSearch(event)">
            </div>

            <div class="home-section">
                <div class="section-title">
                    <span>Hızlı Erişim</span>
                    <button style="background:none; border:none; color:#ff007f; font-size:12px; cursor:pointer; font-weight:bold;" onclick="promptAddBookmark()">+ Site Ekle</button>
                </div>
                <div class="grid-container" id="bookmarks-grid"></div>
            </div>
        </div>
    </div>

    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Ayarlar ⚙️</h3>
                <button class="close-btn" onclick="toggleSettingsModal()">Tamam</button>
            </div>

            <div class="setting-row">
                <span>VPN / Güvenli Tünel</span>
                <input type="checkbox" id="setting-vpn" onchange="updateSettings()">
            </div>

            <div class="setting-row">
                <span>Reklam Engelleme (AdBlock)</span>
                <input type="checkbox" id="setting-adblock" onchange="updateSettings()">
            </div>

            <div class="setting-row">
                <span>Gizli Mod</span>
                <input type="checkbox" id="setting-incognito" onchange="updateSettings()">
            </div>

            <div class="setting-row">
                <span>Arama Motoru</span>
                <select id="setting-search" onchange="updateSettings()">
                    <option value="google">Google</option>
                    <option value="yandex">Yandex</option>
                    <option value="bing">Bing</option>
                    <option value="duckduckgo">DuckDuckGo</option>
                </select>
            </div>

            <div class="setting-row">
                <span>Tema</span>
                <select id="setting-theme" onchange="updateSettings()">
                    <option value="dark">Koyu Tema</option>
                    <option value="light">Açık Tema</option>
                    <option value="system">Sistem</option>
                </select>
            </div>

            <div class="setting-row">
                <span>Adres Barı Konumu</span>
                <select id="setting-bar-pos" onchange="updateSettings()">
                    <option value="top">Üstte</option>
                    <option value="bottom">Altta</option>
                </select>
            </div>
        </div>
    </div>

    <script>
        let state = {
            tabs: [],
            activeTabId: null,
            bookmarks: JSON.parse(localStorage.getItem('neseli_bookmarks') || '[]'),
            settings: JSON.parse(localStorage.getItem('neseli_settings') || JSON.stringify({
                vpn: false,
                adblock: true,
                incognito: false,
                searchEngine: 'google',
                theme: 'dark',
                barPos: 'top'
            }))
        };

        const SEARCH_ENGINES = {
            google: 'https://www.google.com/search?q=',
            yandex: 'https://yandex.com.tr/search/?text=',
            bing: 'https://www.bing.com/search?q=',
            duckduckgo: 'https://duckduckgo.com/?q='
        };

        window.onload = () => {
            applySettingsUI();
            renderBookmarks();
            createNewTab();
        };

        function apply
