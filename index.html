<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Browser</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: white; display: flex; flex-direction: column; height: 100vh; }
        
        #toolbar { display: flex; align-items: center; background: #1e1e1e; padding: 10px; gap: 8px; border-bottom: 1px solid #333; }
        button { background: #2c2c2c; border: none; color: white; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:active { background: #444; }
        #url-input { flex: 1; padding: 8px 12px; border-radius: 6px; border: 1px solid #444; background: #000; color: white; font-size: 14px; }
        
        #vpn-btn { background: #d9534f; font-size: 12px; transition: 0.3s; }
        #vpn-btn.active { background: #2e7d32; }

        #content { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
        .welcome-box { background: #1e1e1e; padding: 25px; border-radius: 12px; max-width: 400px; width: 100%; border: 1px solid #333; }
        h2 { font-size: 22px; margin-bottom: 10px; color: #ff3366; }
        p { color: #aaa; font-size: 14px; margin-bottom: 20px; }
        .search-btn { display: block; width: 100%; padding: 12px; margin-top: 10px; background: #007acc; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 15px; }
    </style>
</head>
<body>

    <div id="toolbar">
        <button onclick="alert('Nexus Browser Ana Sayfadasınız')">🏠</button>
        <input type="text" id="url-input" placeholder="Arama yapın (Örn: teknoloji)...">
        <button id="vpn-btn" onclick="toggleVPN()">VPN: KAPALI</button>
    </div>

    <div id="content">
        <div class="welcome-box">
            <h2>Nexus Browser</h2>
            <p>Chrome hızı, Opera konforu ve yerleşik VPN altyapısıyla hazırlandı.</p>
            <hr style="border: 0; border-top: 1px solid #333; margin: 15px 0;">
            <a href="https://www.google.com" target="_blank" class="search-btn">Google ile Web'de Ara</a>
            <a href="https://m.youtube.com" target="_blank" class="search-btn" style="background: #cc0000;">YouTube Aç</a>
        </div>
    </div>

    <script>
        const urlInput = document.getElementById('url-input');
        const vpnBtn = document.getElementById('vpn-btn');
        let vpnActive = false;

        urlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                let query = urlInput.value.trim();
                if (query) {
                    let searchUrl = 'https://www.google.com/search?q=' + encodeURIComponent(query);
                    window.open(searchUrl, '_blank');
                }
            }
        });

        function toggleVPN() {
            vpnActive = !vpnActive;
            if (vpnActive) {
                vpnBtn.innerText = "VPN: AÇIK (Güvenli Tünel)";
                vpnBtn.classList.add('active');
                alert("Yerleşik VPN Aktif! Trafik güvenli tünel üzerinden şifreleniyor.");
            } else {
                vpnBtn.innerText = "VPN: KAPALI";
                vpnBtn.classList.remove('active');
                alert("VPN Kapatıldı.");
            }
        }
    </script>
</body>
</html>
