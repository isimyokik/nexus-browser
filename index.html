<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neşeli Tarayıcı 🎈</title>
    <style>
        :root {
            --bg-primary: #090a0f;
            --bg-secondary: #121520;
            --bg-card: rgba(255, 255, 255, 0.05);
            --text-color: #f3f4f6;
            --text-dim: #9ca3af;
            --accent-grad: linear-gradient(135deg, #ff007f, #7928ca, #00dfd8);
            --header-bg: rgba(18, 21, 32, 0.9);
            --border-color: rgba(255, 255, 255, 0.1);
            --vpn-glow: transparent;
        }

        body.theme-light {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-card: rgba(0, 0, 0, 0.04);
            --text-color: #1e293b;
            --text-dim: #64748b;
            --header-bg: rgba(255, 255, 255, 0.9);
            --border-color: rgba(0, 0, 0, 0.1);
        }

        body.vpn-active {
            --vpn-glow: rgba(16, 185, 129, 0.22);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s;
        }

        /* SEKME ÇUBUĞU */
        .tabs-bar {
            display: flex;
            align-items: center;
            background: var(--bg-secondary);
            padding: 6px 8px;
            gap: 6px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            scrollbar-width: none;
        }
        .tabs-bar::-webkit-scrollbar { display: none; }

        .tab-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-card);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 13px;
            max-width: 150px;
            min-width: 100px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-dim);
            transition: all 0.2s;
        }

        .tab-item.active {
            background: var(--accent-grad);
            color: white;
            font-weight: 600;
            border-color: transparent;
        }

        .tab-close {
            font-size: 12px;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
        }
        .tab-close:hover { opacity: 1; background: rgba(0,0,0,0.2); }

        .add-tab-btn {
            background: var(--accent-grad);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(255, 0, 127, 0.3);
        }

        /* ÜST VEYA ALT NAVİGASYON BARI */
        .header-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            background-color: var(--vpn-glow);
            z-index: 100;
            flex-shrink: 0;
            transition: background 0.3s;
        }

        .header-bottom {
            order: 10;
            border-top: 1px solid var(--border-color);
            border-bottom: none;
        }

        .nav-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: var(--bg-card);
            color: var(--text-color);
            border-radius: 10px;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
            transition: transform 0.1s;
        }
        .nav-btn:active { transform: scale(0.92); }

        .url-box {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0 12px;
            height: 40px;
            min-width: 0; /* Daralma sorununu önler */
        }
        .url-box:focus-within {
            border-color: #ff007f;
        }

        .url-input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 14px;
            outline: none;
            text-align: center;
        }
        .url-input:focus {
            text-align: left;
        }

        /* İÇERİK ALANI */
        .app-body {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .page-view {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
            display: none;
        }
        .page-view.active {
            display: block;
        }

        /* NEŞELİ ANA SAYFA */
        .home-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
            text-align: center;
            background: var(--bg-primary);
        }
        .home-screen.hidden { display: none; }

        .brand-logo {
            font-size: 48px;
            font-weight: 900;
            background: var(--accent-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .brand-sub {
            color: var(--text-dim);
            font-size: 15px;
            margin-bottom: 30px;
        }

        .search-container {
            width: 100%;
            max-width: 500px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 35px;
        }

        .search-container input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 16px;
            outline: none;
            text-align: center;
        }

        /* KISAYOL GRID */
        .home-section {
            width: 100%;
            max-width: 500px;
            text-align: left;
        }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-dim);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .speed-tile {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            position: relative;
        }
        .speed-tile:active { transform: scale(0.94); }

        .tile-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--accent-grad);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
            font-weight: bold;
        }

        .tile-label {
            font-size: 12px;
            color: var(--text-color);
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }

        .tile-delete {
            position: absolute;
            top: 4px; right: 4px;
            width: 18px; height: 18px;
            background: rgba(255,0,0,0.2);
            color: #ff4b2b;
            border-radius: 50%;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .speed-tile:hover .tile-delete { opacity: 1; }

        /* AYARLAR MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .setting-label {
            font-size: 14px;
            font-weight: 500;
        }

        select, input[type="checkbox"] {
            accent-color: #ff007f;
        }

        select {
            background: var(--bg-card);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 8px;
            outline: none;
        }

        .close-btn {
            background: var(--accent-grad);
            border: none;
            color: white;
            padding: 8px 18px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- SEKME BARI -->
    <div class="tabs-bar" id="tabs-bar">
        <button class="add-tab-btn" onclick="createNewTab()">+</button>
    </div>

    <!-- ÜST VEYA ALT ADRES BARI -->
    <div class="header-bar" id="header-bar">
        <button class="nav-btn" onclick="goBack()" title="Geri">←</button>
        <button class="nav-btn" onclick="goForward()" title="İleri">→</button>
        <button class="nav-btn" onclick="reloadTab()" title="Yenile">↻</button>
        <button class="nav-btn" onclick="goHome()" title="Ana Sayfa">🎈</button>
        
        <div class="url-box">
            <input type="text" id="url-input" class="url-input" placeholder="Google'da ara veya adres yazın..." onkeydown="handleUrlKey(event)">
        </div>

        <button class="nav-btn" onclick="toggleSettingsModal()" title="Ayarlar">⚙️</button>
    </div>

    <!-- İÇERİK ALANI -->
    <div class="app-body" id="app-body">
        
        <!-- NEŞELİ ANA SAYFA -->
        <div class="home-screen" id="home-screen">
            <div class="brand-logo">Neşeli 🎈</div>
            <div class="brand-sub">Hızlı, Özgür ve Renkli Web Deneyimi</div>

            <!-- ORTADAKİ ARAMA KUTUSU -->
            <div class="search-container">
                <span style="font-size: 18px;">🔍</span>
                <input type="text" id="home-search-input" placeholder="Google'da ara veya adres yaz..." onkeydown="handleHomeSearch(event)">
            </div>

            <!-- KULLANICI KISAYOLLARI -->
            <div class="home-section">
                <div class="section-title">
                    <span>Hızlı Erişim (Speed Dial)</span>
                    <button style="background:none; border:none; color:#ff007f; font-size:12px; cursor:pointer; font-weight:bold;" onclick="promptAddBookmark()">+ Site Ekle</button>
                </div>
                <div class="grid-container" id="bookmarks-grid"></div>
            </div>
        </div>

    </div>

    <!-- AYARLAR MODAL -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Ayarlar ⚙️</h3>
                <button class="close-btn" onclick="toggleSettingsModal()">Kapat</button>
            </div>

            <div class="setting-row">
                <span class="setting-label">Gelişmiş VPN Modu</span>
                <input type="checkbox" id="setting-vpn" onchange="updateSettings()">
            </div>

            <div class="setting-row">
                <span class="setting-label">Arama Motoru</span>
                <select id="setting-search" onchange="updateSettings()">
                    <option value="google">Google</option>
                    <option value="yandex">Yandex</option>
                    <option value="bing">Bing</option>
                    <option value="duckduckgo">DuckDuckGo</option>
                </select>
            </div>

            <div class="setting-row">
                <span class="setting-label">Tema</span>
                <select id="setting-theme" onchange="updateSettings()">
                    <option value="dark">Koyu Tema</option>
                    <option value="light">Açık Tema</option>
                    <option value="system">Sistem</option>
                </select>
            </div>

            <div class="setting-row">
                <span class="setting-label">Adres Barı Konumu</span>
                <select id="setting-bar-pos" onchange="updateSettings()">
                    <option value="top">Üstte</option>
                    <option value="bottom">Altta</option>
                </select>
            </div>
        </div>
    </div>

    <script>
        let state = {
            tabs: [],
            activeTabId: null,
            bookmarks: JSON.parse(localStorage.getItem('neseli_bookmarks') || '[]'),
            settings: JSON.parse(localStorage.getItem('neseli_settings') || JSON.stringify({
                vpn: false,
                searchEngine: 'google',
                theme: 'dark',
                barPos: 'top'
            }))
        };

        const SEARCH_ENGINES = {
            google: 'https://www.google.com/search?q=',
            yandex: 'https://yandex.com.tr/search/?text=',
            bing: 'https://www.bing.com/search?q=',
            duckduckgo: 'https://duckduckgo.com/?q='
        };

        window.onload = () => {
            applySettingsUI();
            renderBookmarks();
            createNewTab();
        };

        function applySettingsUI() {
            document.getElementById('setting-vpn').checked = state.settings.vpn;
            document.getElementById('setting-search').value = state.settings.searchEngine;
            document.getElementById('setting-theme').value = state.settings.theme;
            document.getElementById('setting-bar-pos').value = state.settings.barPos;

            document.body.classList.remove('theme-light');
            if (state.settings.theme === 'light') {
                document.body.classList.add('theme-light');
            } else if (state.settings.theme === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches) {
                document.body.classList.add('theme-light');
            }

            document.body.classList.toggle('vpn-active', state.settings.vpn);

            const header = document.getElementById('header-bar');
            if (state.settings.barPos === 'bottom') {
                header.classList.add('header-bottom');
            } else {
                header.classList.remove('header-bottom');
            }
        }

        function updateSettings() {
            state.settings.vpn = document.getElementById('setting-vpn').checked;
            state.settings.searchEngine = document.getElementById('setting-search').value;
            state.settings.theme = document.getElementById('setting-theme').value;
            state.settings.barPos = document.getElementById('setting-bar-pos').value;

            localStorage.setItem('neseli_settings', JSON.stringify(state.settings));
            applySettingsUI();
        }

        function toggleSettingsModal() {
            const modal = document.getElementById('settings-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function createNewTab(url = null) {
            const id = 'tab_' + Date.now();
            const tab = { id, title: 'Yeni Sekme', url: null };
            state.tabs.push(tab);

            const iframe = document.createElement('iframe');
            iframe.className = 'page-view';
            iframe.id = 'iframe_' + id;
            document.getElementById('app-body').appendChild(iframe);

            switchTab(id);
            if (url) navigateTo(url);
        }

        function switchTab(id) {
            state.activeTabId = id;
            const tab = state.tabs.find(t => t.id === id);

            document.querySelectorAll('.page-view').forEach(f => f.classList.remove('active'));
            const homeScreen = document.getElementById('home-screen');

            if (tab && tab.url) {
                homeScreen.classList.add('hidden');
                const iframe = document.getElementById('iframe_' + id);
                if (iframe) iframe.classList.add('active');
                document.getElementById('url-input').value = tab.url;
            } else {
                homeScreen.classList.remove('hidden');
                document.getElementById('url-input').value = '';
            }
            renderTabs();
        }

        function closeTab(id, event) {
            if (event) event.stopPropagation();
            const iframe = document.getElementById('iframe_' + id);
            if (iframe) iframe.remove();

            state.tabs = state.tabs.filter(t => t.id !== id);
            if (state.tabs.length === 0) {
                createNewTab();
            } else if (state.activeTabId === id) {
                switchTab(state.tabs[state.tabs.length - 1].id);
            } else {
                renderTabs();
            }
        }

        function renderTabs() {
            const tabsBar = document.getElementById('tabs-bar');
            tabsBar.innerHTML = '';

            state.tabs.forEach(tab => {
                const el = document.createElement('div');
                el.className = `tab-item ${tab.id === state.activeTabId ? 'active' : ''}`;
                el.onclick = () => switchTab(tab.id);
                el.innerHTML = `
                    <span>🎈 ${tab.title}</span>
                    <span class="tab-close" onclick="closeTab('${tab.id}', event)">✕</span>
                `;
                tabsBar.appendChild(el);
            });

            const addBtn = document.createElement('button');
            addBtn.className = 'add-tab-btn';
            addBtn.innerText = '+';
            addBtn.onclick = () => createNewTab();
            tabsBar.appendChild(addBtn);
        }

        function handleUrlKey(e) {
            if (e.key === 'Enter') navigateTo(e.target.value.trim());
        }

        function handleHomeSearch(e) {
            if (e.key === 'Enter') navigateTo(e.target.value.trim());
        }

        function navigateTo(val) {
            if (!val) return;
            const tab = state.tabs.find(t => t.id === state.activeTabId);
            if (!tab) return;

            let targetUrl = val;
            if (!val.startsWith('http://') && !val.startsWith('https://')) {
                if (val.includes('.') && !val.includes(' ')) {
                    targetUrl = 'https://' + val;
                } else {
                    let engine = SEARCH_ENGINES[state.settings.searchEngine] || SEARCH_ENGINES.google;
                    targetUrl = engine + encodeURIComponent(val);
                }
            }

            tab.url = targetUrl;
            tab.title = val.replace('https://', '').replace('http://', '').split('/')[0];

            let iframe = document.getElementById('iframe_' + tab.id);
            if (iframe) {
                iframe.src = state.settings.vpn ? 'https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl) : targetUrl;
            }

            switchTab(tab.id);
            document.getElementById('home-search-input').value = '';
        }

        function goHome() {
            const tab = state.tabs.find(t => t.id === state.activeTabId);
            if (tab) {
                tab.url = null;
                tab.title = 'Yeni Sekme';
                switchTab(tab.id);
            }
        }

        function goBack() {
            const iframe = document.getElementById('iframe_' + state.activeTabId);
            try { if (iframe && iframe.contentWindow) iframe.contentWindow.history.back(); } catch(e){}
        }

        function goForward() {
            const iframe = document.getElementById('iframe_' + state.activeTabId);
            try { if (iframe && iframe.contentWindow) iframe.contentWindow.history.forward(); } catch(e){}
        }

        function reloadTab() {
            const iframe = document.getElementById('iframe_' + state.activeTabId);
            if (iframe && iframe.src) iframe.src = iframe.src;
        }

        function promptAddBookmark() {
            let name = prompt("Site Adı (Örn: YouTube):");
            let url = prompt("Site Adresi (Örn: youtube.com):");
            if (name && url) {
                state.bookmarks.push({ name, url });
                localStorage.setItem('neseli_bookmarks', JSON.stringify(state.bookmarks));
                renderBookmarks();
            }
        }

        function deleteBookmark(index, event) {
            event.stopPropagation();
            state.bookmarks.splice(index, 1);
            localStorage.setItem('neseli_bookmarks', JSON.stringify(state.bookmarks));
            renderBookmarks();
        }

        function renderBookmarks() {
            const grid = document.getElementById('bookmarks-grid');
            grid.innerHTML = '';
            
            state.bookmarks.forEach((bm, index) => {
                const el = document.createElement('div');
                el.className = 'speed-tile';
                el.onclick = () => navigateTo(bm.url);
                el.innerHTML = `
                    <div class="tile-icon">${bm.name.charAt(0).toUpperCase()}</div>
                    <div class="tile-label">${bm.name}</div>
                    <div class="tile-delete" onclick="deleteBookmark(${index}, event)">✕</div>
                `;
                grid.appendChild(el);
            });
        }
    </script>
</body>
</html>
