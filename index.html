<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Browser</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #121212; color: white; display: flex; flex-direction: column; height: 100vh; }
        #toolbar { display: flex; align-items: center; background: #1e1e1e; padding: 8px; gap: 6px; }
        button { background: #2c2c2c; border: none; color: white; padding: 8px 12px; border-radius: 6px; font-weight: bold; }
        #url-input { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #000; color: white; }
        #vpn-btn { background: #d9534f; font-size: 12px; }
        #vpn-btn.active { background: #2e7d32; }
        #content { flex: 1; }
        iframe { width: 100%; height: 100%; border: none; background: white; }
    </style>
</head>
<body>
    <div id="toolbar">
        <button onclick="document.getElementById('webframe').contentWindow.history.back()">◄</button>
        <button onclick="document.getElementById('webframe').contentWindow.history.forward()">►</button>
        <input type="text" id="url-input" placeholder="Web adresi girin...">
        <button id="vpn-btn" onclick="toggleVPN()">VPN: KAPALI</button>
    </div>
    <div id="content">
        <iframe id="webframe" src="https://www.bing.com"></iframe>
    </div>
    <script>
        const iframe = document.getElementById('webframe');
        const urlInput = document.getElementById('url-input');
        const vpnBtn = document.getElementById('vpn-btn');
        let vpnActive = false;

        urlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                let url = urlInput.value.trim();
                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
                }
                iframe.src = url;
            }
        });

        function toggleVPN() {
            vpnActive = !vpnActive;
            vpnBtn.innerText = vpnActive ? "VPN: AÇIK" : "VPN: KAPALI";
            vpnBtn.className = vpnActive ? "active" : "";
            alert(vpnActive ? "Yerleşik Güvenli Tünel Aktif!" : "VPN Kapatıldı.");
        }
    </script>
</body>
</html>
