<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neşeli Tarayıcı 🎈</title>
    <style>
        :root {
            --bg-primary: #0f1015;
            --bg-secondary: #181a24;
            --bg-card: rgba(255, 255, 255, 0.05);
            --text-color: #f3f4f6;
            --text-dim: #9ca3af;
            --accent-grad: linear-gradient(135deg, #ff007f, #7928ca, #00dfd8);
            --header-bg: rgba(24, 26, 36, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --vpn-glow: transparent;
        }

        body.theme-light {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-card: rgba(0, 0, 0, 0.04);
            --text-color: #1e293b;
            --text-dim: #64748b;
            --header-bg: rgba(255, 255, 255, 0.9);
            --border-color: rgba(0, 0, 0, 0.1);
        }

        body.vpn-active {
            --vpn-glow: rgba(16, 185, 129, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Sekme BARI */
        .tabs-bar {
            display: flex;
            align-items: center;
            background: var(--bg-secondary);
            padding: 4px 6px;
            gap: 4px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border-color);
            scrollbar-width: none;
        }
        .tabs-bar::-webkit-scrollbar { display: none; }

        .tab-item {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-card);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 13px;
            max-width: 140px;
            min-width: 90px;
            cursor: pointer;
            border: 1px solid transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s;
        }

        .tab-item.active {
            background: var(--accent-grad);
            color: white;
            font-weight: bold;
        }

        .tab-item.incognito {
            border: 1px solid #a855f7;
        }

        .tab-close {
            font-size: 12px;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
        }
        .tab-close:hover { opacity: 1; background: rgba(0,0,0,0.2); }

        .add-tab-btn {
            background: var(--accent-grad);
            border: none;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(255, 0, 127, 0.3);
        }

        /* NAVBAR HEADER (SABİT) */
        .header-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 10px;
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            background-color: var(--vpn-glow);
            z-index: 1000;
            transition: background 0.3s, border-color 0.3s;
        }

        .header-bottom {
            order: 10;
            border-top: 1px solid var(--border-color);
            border-bottom: none;
        }

        .nav-btn {
            width: 34px;
            height: 34px;
            border: none;
            background: var(--bg-card);
            color: var(--text-color);
            border-radius: 10px;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.1s, background 0.2s;
        }
        .nav-btn:active { transform: scale(0.92); }

        .url-box {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0 10px;
            height: 38px;
            transition: border-color 0.2s;
        }
        .url-box:focus-within {
            border-color: #ff007f;
        }

        .url-input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 14px;
            outline: none;
        }

        /* İÇERİK ALANI */
        .app-body {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
            display: none;
        }

        iframe.active {
            display: block;
        }

        /* NEŞELİ ANA SAYFA */
        .home-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 30px 20px;
            overflow-y: auto;
            text-align: center;
        }

        .brand-logo {
            font-size: 42px;
            font-weight: 900;
            background: var(--accent-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            letter-spacing: -1px;
        }

        .brand-sub {
            color: var(--text-dim);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .home-section {
            width: 100%;
            max-width: 480px;
            margin-bottom: 25px;
            text-align: left;
        }

        .section-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 12px;
        }

        .speed-tile {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            text-decoration: none;
            color: var(--text-color);
        }
        .speed-tile:active { transform: scale(0.94); }

        .tile-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--accent-grad);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
            font-weight: bold;
        }

        .tile-label {
            font-size: 11px;
            max-width: 70px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .add-tile-btn {
            border: 2px dashed var(--border-color);
            background: transparent;
        }

        /* AYARLAR MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .setting-label {
            font-size: 14px;
            font-weight: 500;
        }

        select, input[type="checkbox"] {
            accent-color: #ff007f;
        }

        select {
            background: var(--bg-card);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 8px;
            outline: none;
        }

        .close-btn {
            background: var(--accent-grad);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- SEKMELER BARI -->
    <div class="tabs-bar" id="tabs-bar">
        <!-- Dinamik Sekmeler -->
        <button class="add-tab-btn" onclick="createNewTab()">+</button>
    </div>

    <!-- SADE SABİT ÜST BAR -->
    <div class="header-bar" id="header-bar">
        <button class="nav-btn" onclick="goBack()">←</button>
        <button class="nav-btn" onclick="goForward()">→</button>
        <button class="nav-btn" onclick="reloadTab()">↻</button>
        <button class="nav-btn" onclick="goHome()">🎈</button>
        
        <div class="url-box">
            <input type="text" id="url-input" class="url-input" placeholder="Google'da ara veya URL yazın..." onkeydown="handleUrlKey(event)">
        </div>

        <button class="nav-btn" onclick="toggleSettingsModal()">⚙️</button>
    </div>

    <!-- İÇERİK BÖLGESİ -->
    <div class="app-body" id="app-body">
        
        <!-- NEŞELİ ANA SAYFA EKRANI -->
        <div class="home-screen" id="home-screen">
            <div class="brand-logo">Neşeli 🎈</div>
            <div class="brand-sub">Hızlı, Özgür ve Renkli Web Deneyimi</div>

            <!-- KULLANICI HIZLI ERİŞİM SİTELERİ -->
            <div class="home-section">
                <div class="section-title">
                    <span>Hızlı Erişim</span>
                    <button style="background:none; border:none; color:#ff007f; font-size:12px; cursor:pointer;" onclick="promptAddBookmark()">+ Site Ekle</button>
                </div>
                <div class="grid-container" id="bookmarks-grid">
                    <!-- Dinamik Kullanıcı Kısayolları -->
                </div>
            </div>

            <!-- GEÇMİŞ (SON GEZİLEN SİTELER) -->
            <div class="home-section">
                <div class="section-title">
                    <span>Son Gezilenler</span>
                    <button style="background:none; border:none; color:var(--text-dim); font-size:12px; cursor:pointer;" onclick="clearHistory()">Temizle</button>
                </div>
                <div class="grid-container" id="history-grid">
                    <!-- Dinamik Geçmiş Siteleri -->
                </div>
            </div>
        </div>

    </div>

    <!-- AYARLAR MODAL -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Ayarlar ⚙️</h3>
                <button class="close-btn" onclick="toggleSettingsModal()">Tamam</button>
            </div>

            <div class="setting-row">
                <span class="setting-label">Gelişmiş VPN / Proxy Tüneli</span>
                <input type="checkbox" id="setting-vpn" onchange="updateSettings()">
            </div>

            <div class="setting-row">
                <span class="setting-label">Reklam Engelleme (AdBlock)</span>
                <input type="checkbox" id="setting-adblock" onchange="updateSettings()">
            </div>

            <div class="setting-row">
                <span class="setting-label">Arama Motoru</span>
                <select id="setting-search" onchange="updateSettings()">
                    <option value="google">Google</option>
                    <option value="yandex">Yandex</option>
                    <option value="bing">Bing</option>
                    <option value="duckduckgo">DuckDuckGo</option>
                </select>
            </div>

            <div class="setting-row">
                <span class="setting-label">Görünüm Teması</span>
                <select id="setting-theme" onchange="updateSettings()">
                    <option value="dark">Koyu Tema</option>
                    <option value="light">Açık Tema</option>
                    <option value="system">Telefon Varsayılanı</option>
                </select>
            </div>

            <div class="setting-row">
                <span class="setting-label">Adres Barı Konumu</span>
                <select id="setting-bar-pos" onchange="updateSettings()">
                    <option value="top">Üstte</option>
                    <option value="bottom">Altta</option>
                </select>
            </div>

            <div class="setting-row">
                <span class="setting-label">Gizli Mod (Otomatik)</span>
                <input type="checkbox" id="setting-incognito" onchange="updateSettings()">
            </div>
        </div>
    </div>

    <script>
        // DURUM YÖNETİMİ & LOCALSTORAGE
        let state = {
            tabs: [],
            activeTabId: null,
            bookmarks: JSON.parse(localStorage.getItem('neseli_bookmarks') || '[]'),
            history: JSON.parse(localStorage.getItem('neseli_history') || '[]'),
            settings: JSON.parse(localStorage.getItem('neseli_settings') || JSON.stringify({
                vpn: false,
                adblock: true,
                searchEngine: 'google',
                theme: 'dark',
                barPos: 'top',
                incognito: false
            }))
        };

        const SEARCH_ENGINES = {
            google: 'https://www.google.com/search?q=',
            yandex: 'https://yandex.com.tr/search/?text=',
            bing: 'https://www.bing.com/search?q=',
            duckduckgo: 'https://duckduckgo.com/?q='
        };

        // BAŞLANGIÇ
        window.onload = () => {
            applySettingsUI();
            renderBookmarks();
            renderHistory();
            createNewTab();
        };

        // AYARLARI UYGULA
        function applySettingsUI() {
            document.getElementById('setting-vpn').checked = state.settings.vpn;
            document.getElementById('setting-adblock').checked = state.settings.adblock;
            document.getElementById('setting-search').value = state.settings.searchEngine;
            document.getElementById('setting-theme').value = state.settings.theme;
            document.getElementById('setting-bar-pos').value = state.settings.barPos;
            document.getElementById('setting-incognito').checked = state.settings.incognito;

            // Tema Ayarla
            document.body.classList.remove('theme-light');
            if (state.settings.theme === 'light') {
                document.body.classList.add('theme-light');
            } else if (state.settings.theme === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches) {
                document.body.classList.add('theme-light');
            }

            // VPN Efekti
            document.body.classList.toggle('vpn-active', state.settings.vpn);

            // Bar Konumu
            const header = document.getElementById('header-bar');
            if (state.settings.barPos === 'bottom') {
                header.classList.add('header-bottom');
            } else {
                header.classList.remove('header-bottom');
            }
        }

        function updateSettings() {
            state.settings.vpn = document.getElementById('setting-vpn').checked;
            state.settings.adblock = document.getElementById('setting-adblock').checked;
            state.settings.searchEngine = document.getElementById('setting-search').value;
            state.settings.theme = document.getElementById('setting-theme').value;
            state.settings.barPos = document.getElementById('setting-bar-pos').value;
            state.settings.incognito = document.getElementById('setting-incognito').checked;

            localStorage.setItem('neseli_settings', JSON.stringify(state.settings));
            applySettingsUI();
        }

        function toggleSettingsModal() {
            const modal = document.getElementById('settings-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        // SEKME YÖNETİMİ
        function createNewTab(url = null) {
            const id = 'tab_' + Date.now();
            const tab = {
                id: id,
                title: 'Yeni Sekme',
                url: url,
                isIncognito: state.settings.incognito
            };

            state.tabs.push(tab);
            
            // IFRAME Oluştur
            if (url) {
                const iframe = document.createElement('iframe');
                iframe.id = 'iframe_' + id;
                iframe.src = formatUrl(url);
                document.getElementById('app-body').appendChild(iframe);
            }

            switchTab(id);
            renderTabs();
        }

        function switchTab(id) {
            state.activeTabId = id;
            const tab = state.tabs.find(t => t.id === id);

            // Tüm Iframe'leri Gizle
            document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));
            const homeScreen = document.getElementById('home-screen');

            if (tab && tab.url) {
                homeScreen.style.display = 'none';
                const activeIframe = document.getElementById('iframe_' + id);
                if (activeIframe) activeIframe.classList.add('active');
                document.getElementById('url-input').value = tab.url;
            } else {
                homeScreen.style.display = 'flex';
                document.getElementById('url-input').value = '';
            }

            renderTabs();
        }

        function closeTab(id, event) {
            if (event) event.stopPropagation();
            const iframe = document.getElementById('iframe_' + id);
            if (iframe) iframe.remove();

            state.tabs = state.tabs.filter(t => t.id !== id);

            if (state.tabs.length === 0) {
                createNewTab();
            } else if (state.activeTabId === id) {
                switchTab(state.tabs[state.tabs.length - 1].id);
            } else {
                renderTabs();
            }
        }

        function renderTabs() {
            const tabsBar = document.getElementById('tabs-bar');
            tabsBar.innerHTML = '';

            state.tabs.forEach(tab => {
                const el = document.createElement('div');
                el.className = `tab-item ${tab.id === state.activeTabId ? 'active' : ''} ${tab.isIncognito ? 'incognito' : ''}`;
                el.onclick = () => switchTab(tab.id);

                el.innerHTML = `
                    <span>${tab.isIncognito ? '🕵️' : '🎈'} ${tab.title}</span>
                    <span class="tab-close" onclick="closeTab('${tab.id}', event)">✕</span>
                `;
                tabsBar.appendChild(el);
            });

            const addBtn = document.createElement('button');
            addBtn.className = 'add-tab-btn';
            addBtn.innerText = '+';
            addBtn.onclick = () => createNewTab();
            tabsBar.appendChild(addBtn);
        }

        // ADRES VE ARAMA
        function handleUrlKey(e) {
            if (e.key === 'Enter') {
                let val = document.getElementById('url-input').value.trim();
                if (val) {
                    navigateTo(val);
                }
            }
        }

        function formatUrl(val) {
            if (val.startsWith('http://') || val.startsWith('https://')) {
                return state.settings.vpn ? 'https://api.allorigins.win/raw?url=' + encodeURIComponent(val) : val;
            }
            if (val.includes('.') && !val.includes(' ')) {
                let target = 'https://' + val;
                return state.settings.vpn ? 'https://api.allorigins.win/raw?url=' + encodeURIComponent(target) : target;
            }
            let searchEngineUrl = SEARCH_ENGINES[state.settings.searchEngine] || SEARCH_ENGINES.google;
            return searchEngineUrl + encodeURIComponent(val);
        }

        function navigateTo(val) {
            const tab = state.tabs.find(t => t.id === state.activeTabId);
            if (!tab) return;

            tab.url = val;
            tab.title = val.replace('https://', '').replace('http://', '').split('/')[0];

            let finalSrc = formatUrl(val);

            let iframe = document.getElementById('iframe_' + tab.id);
            if (!iframe) {
                iframe = document.createElement('iframe');
                iframe.id = 'iframe_' + tab.id;
                document.getElementById('app-body').appendChild(iframe);
            }
            iframe.src = finalSrc;

            // Gizli Modda Değilse Geçmişe Ekle
            if (!tab.isIncognito) {
                addToHistory(tab.title, val);
            }

            switchTab(tab.id);
        }

        function goHome() {
            const tab = state.tabs.find(t => t.id === state.activeTabId);
            if (tab) {
                tab.url = null;
                tab.title = 'Yeni Sekme';
                const iframe = document.getElementById('iframe_' + tab.id);
                if (iframe) iframe.remove();
                switchTab(tab.id);
            }
        }

        function goBack() {
            const iframe = document.getElementById('iframe_' + state.activeTabId);
            if (iframe && iframe.contentWindow) iframe.contentWindow.history.back();
        }

        function goForward() {
            const iframe = document.getElementById('iframe_' + state.activeTabId);
            if (iframe && iframe.contentWindow) iframe.contentWindow.history.forward();
        }

        function reloadTab() {
            const iframe = document.getElementById('iframe_' + state.activeTabId);
            if (iframe) iframe.src = iframe.src;
        }

        // KISAYOL VE GEÇMİŞ YÖNETİMİ
        function promptAddBookmark() {
            let name = prompt("Site Adı:");
            let url = prompt("Site Adresi (URL):");
            if (name && url) {
                state.bookmarks.push({ name, url });
                localStorage.setItem('neseli_bookmarks', JSON.stringify(state.bookmarks));
                renderBookmarks();
            }
        }

        function renderBookmarks() {
            const grid = document.getElementById('bookmarks-grid');
            grid.innerHTML = '';
            
            state.bookmarks.forEach(bm => {
                const el = document.createElement('a');
                el.className = 'speed-tile';
                el.onclick = () => navigateTo(bm.url);
                el.innerHTML = `
                    <div class="tile-icon">${bm.name.charAt(0).toUpperCase()}</div>
                    <div class="tile-label">${bm.name}</div>
                `;
                grid.appendChild(el);
            });
        }

        function addToHistory(title, url) {
            state.history = state.history.filter(h => h.url !== url);
            state.history.unshift({ title, url });
            if (state.history.length > 8) state.history.pop();
            localStorage.setItem('neseli_history', JSON.stringify(state.history));
            renderHistory();
        }

        function renderHistory() {
            const grid = document.getElementById('history-grid');
            grid.innerHTML = '';

            state.history.forEach(h => {
                const el = document.createElement('a');
                el.className = 'speed-tile';
                el.onclick = () => navigateTo(h.url);
                el.innerHTML = `
                    <div class="tile-icon" style="background:var(--bg-card); border:1px solid var(--border-color);">🌐</div>
                    <div class="tile-label">${h.title}</div>
                `;
                grid.appendChild(el);
            });
        }

        function clearHistory() {
            state.history = [];
            localStorage.removeItem('neseli_history');
            renderHistory();
        }
    </script>
</body>
</html>
