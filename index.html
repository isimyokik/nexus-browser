    <script>
        // State Management
        let tabs = [];
        let activeTabId = null;
        let vpnEnabled = true;
        let browsingHistory = [];
        let blockedTrackers = 28;

        // Speed Dial Items
        const speedDialItems = [
            { name: 'Google', url: 'https://www.google.com', icon: 'fa-brands fa-google', color: '#ea4335' },
            { name: 'YouTube', url: 'https://m.youtube.com', icon: 'fa-brands fa-youtube', color: '#ff0000' },
            { name: 'Wikipedia', url: 'https://www.wikipedia.org', icon: 'fa-solid fa-book', color: '#ffffff' },
            { name: 'GitHub', url: 'https://github.com', icon: 'fa-brands fa-github', color: '#ffffff' },
            { name: 'Reddit', url: 'https://www.reddit.com', icon: 'fa-brands fa-reddit-alien', color: '#ff4500' },
            { name: 'ChatGPT', url: 'https://chatgpt.com', icon: 'fa-solid fa-robot', color: '#10a37f' }
        ];

        // Initialization
        window.onload = () => {
            createNewTab();
        };

        // Create a New Tab (Chrome Style)
        function createNewTab(url = null) {
            const tabId = 'tab-' + Date.now();
            const newTab = {
                id: tabId,
                title: 'Yeni Sekme',
                url: url || 'about:blank',
                history: [url || 'about:blank'],
                historyIndex: 0
            };

            tabs.push(newTab);
            renderTabHeader(newTab);
            renderTabView(newTab);
            switchTab(tabId);

            if (url) {
                loadUrlInTab(tabId, url);
            }
        }

        // Render Chrome Tab in Top Bar
        function renderTabHeader(tab) {
            const tabsList = document.getElementById('tabsList');
            const tabElement = document.createElement('div');
            tabElement.className = 'tab-item';
            tabElement.id = `header-${tab.id}`;
            tabElement.onclick = () => switchTab(tab.id);
            tabElement.innerHTML = `
                <i class="fa-solid fa-globe tab-favicon"></i>
                <span class="tab-title" id="title-${tab.id}">${tab.title}</span>
                <span class="close-tab-btn" onclick="closeTab('${tab.id}', event)"><i class="fa-solid fa-xmark"></i></span>
            `;
            tabsList.appendChild(tabElement);
        }

        // Render Tab Frame View (Speed Dial / Web View)
        function renderTabView(tab) {
            const contentArea = document.getElementById('contentArea');
            const viewElement = document.createElement('div');
            viewElement.className = 'tab-view';
            viewElement.id = `view-${tab.id}`;

            viewElement.innerHTML = `
                <div class="speed-dial-page" id="dial-${tab.id}">
                    <div class="browser-brand">
                        <i class="fa-solid fa-bolt"></i>
                        <h1>Nexus Browser</h1>
                    </div>
                    
                    <div class="dial-search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" class="dial-search-input" placeholder="Google'da arayın veya bir adrese gidin..." onkeydown="handleDialSearch(event, '${tab.id}')">
                    </div>

                    <div class="dial-grid">
                        ${speedDialItems.map(item => `
                            <div class="dial-tile" onclick="loadUrlInTab('${tab.id}', '${item.url}')">
                                <div class="tile-icon-wrapper" style="color: ${item.color};">
                                    <i class="${item.icon}"></i>
                                </div>
                                <span class="tile-label">${item.name}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="iframe-container" id="iframe-box-${tab.id}" style="display:none;">
                    <div class="cors-banner" id="cors-banner-${tab.id}" style="display:none;">
                        <span><i class="fa-solid fa-triangle-exclamation"></i> Güvenlik/CORS kısıtlaması nedeniyle bu site gömülü pencerede engellenebilir.</span>
                        <button onclick="openExternalNative('${tab.id}')">Dışarıda Aç</button>
                    </div>
                    <iframe id="iframe-${tab.id}" src=""></iframe>
                </div>
            `;
            contentArea.appendChild(viewElement);
        }

        // Switch Active Tab
        function switchTab(tabId) {
            activeTabId = tabId;
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-view').forEach(el => el.classList.remove('active'));

            const activeHeader = document.getElementById(`header-${tabId}`);
            const activeView = document.getElementById(`view-${tabId}`);

            if (activeHeader) activeHeader.classList.add('active');
            if (activeView) activeView.classList.add('active');

            const currentTab = tabs.find(t => t.id === tabId);
            if (currentTab) {
                document.getElementById('addressInput').value = currentTab.url === 'about:blank' ? '' : currentTab.url;
            }
        }

        // Close Tab
        function closeTab(tabId, event) {
            event.stopPropagation();
            if (tabs.length === 1) {
                // If last tab, just reset it
                loadUrlInTab(tabId, 'about:blank');
                return;
            }

            tabs = tabs.filter(t => t.id !== tabId);
            document.getElementById(`header-${tabId}`).remove();
            document.getElementById(`view-${tabId}`).remove();

            if (activeTabId === tabId) {
                switchTab(tabs[tabs.length - 1].id);
            }
        }

        // Smart Navigation / Search Execution
        function loadUrlInTab(tabId, targetUrl) {
            let finalUrl = targetUrl.trim();

            if (!finalUrl.startsWith('http://') && !finalUrl.startsWith('https://') && finalUrl !== 'about:blank') {
                if (finalUrl.includes('.') && !finalUrl.includes(' ')) {
                    finalUrl = 'https://' + finalUrl;
                } else {
                    finalUrl = 'https://www.google.com/search?q=' + encodeURIComponent(finalUrl);
                }
            }

            const tab = tabs.find(t => t.id === tabId);
            if (tab) {
                tab.url = finalUrl;
                tab.title = finalUrl.replace('https://', '').replace('http://', '').split('/')[0] || 'Yeni Sekme';
                document.getElementById(`title-${tabId}`).innerText = tab.title;

                browsingHistory.push({ url: finalUrl, time: new Date().toLocaleTimeString() });

                const dialElem = document.getElementById(`dial-${tabId}`);
                const iframeBox = document.getElementById(`iframe-box-${tabId}`);
                const iframe = document.getElementById(`iframe-${tabId}`);
                const corsBanner = document.getElementById(`cors-banner-${tabId}`);

                if (finalUrl === 'about:blank') {
                    dialElem.style.display = 'flex';
                    iframeBox.style.display = 'none';
                } else {
                    dialElem.style.display = 'none';
                    iframeBox.style.display = 'block';
                    corsBanner.style.display = 'flex';
                    iframe.src = finalUrl;
                }

                if (tabId === activeTabId) {
                    document.getElementById('addressInput').value = finalUrl === 'about:blank' ? '' : finalUrl;
                }
            }
        }

        // Handle Omnibox Inputs
        function handleAddressInput(e) {
            if (e.key === 'Enter') submitAddress();
        }

        function submitAddress() {
            const input = document.getElementById('addressInput').value;
            if (input && activeTabId) {
                loadUrlInTab(activeTabId, input);
            }
        }

        function handleDialSearch(e, tabId) {
            if (e.key === 'Enter') {
                loadUrlInTab(tabId, e.target.value);
            }
        }

        function goHome() {
            if (activeTabId) loadUrlInTab(activeTabId, 'about:blank');
        }

        function reloadTab() {
            if (activeTabId) {
                const tab = tabs.find(t => t.id === activeTabId);
                if (tab && tab.url !== 'about:blank') loadUrlInTab(activeTabId, tab.url);
            }
        }

        function openExternalNative(tabId) {
            const tab = tabs.find(t => t.id === tabId);
            if (tab && tab.url) window.open(tab.url, '_blank');
        }

        // Opera VPN Toggle & Controls
        function toggleVpn() {
            vpnEnabled = !vpnEnabled;
            const badge = document.getElementById('omniboxVpnBadge');
            const toggle = document.getElementById('vpnToggle');
            const statusText = document.getElementById('vpnStatusText');

            if (vpnEnabled) {
                badge.classList.remove('off');
                toggle.classList.add('active');
                statusText.innerText = 'VPN';
            } else {
                badge.classList.add('off');
                toggle.classList.remove('active');
                statusText.innerText = 'VPN KAPALI';
            }
        }

        function changeVpnServer() {
            const server = document.getElementById('vpnServerSelect').value;
            document.getElementById('vpnIpAddress').innerText = `IP: 185.220.101.5 (${server})`;
        }

        // Modals Logic
        function openVpnModal() { document.getElementById('vpnModal').classList.add('active'); }
        function openPrivacyModal() { document.getElementById('privacyModal').classList.add('active'); }
        
        function openHistoryModal() {
            const list = document.getElementById('historyList');
            list.innerHTML = browsingHistory.length ? browsingHistory.map(h => `
                <div style="padding: 6px 0; border-bottom: 1px solid var(--border-color);">
                    <span style="color: var(--accent-primary);">${h.time}</span> - ${h.url}
                </div>
            `).join('') : '<p style="color: var(--text-muted);">Henüz geçmiş yok.</p>';
            document.getElementById('historyModal').classList.add('active');
        }

        function clearHistory() {
            browsingHistory = [];
            openHistoryModal();
        }

        function closeModals() {
            document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
        }

        function openExternalTool(url) {
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
